  --cream: #FDF6EC;
  --crimson: #8B0000;
  --crimson2: #B22222;
  --crimson3: #DC143C;
  --gold: #B8860B;
  --ink: #2C1010;
  --muted: #7A5C5C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--cream);
  background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(139,0,0,0.04) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(139,0,0,0.04) 40px);
  font-family: 'Lora', serif;
  color: var(--ink);
  min-height: 100vh;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

/* HEADER */
.eyebrow {
  font-family: 'Bebas Neue', cursive;
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--gold);
  text-align: center;
  margin-bottom: 4px;
}

.main-title {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(56px, 14vw, 96px);
  color: var(--crimson);
  text-align: center;
  line-height: 0.9;
  text-shadow: 3px 3px 0 var(--cream), 4px 4px 0 rgba(139,0,0,0.3);
  letter-spacing: 4px;
}

.subtitle-bar {
  border-top: 2px solid var(--crimson);
  margin: 10px 0 6px;
  padding-top: 8px;
  text-align: center;
}

.subtitle {
  font-family: 'Bebas Neue', cursive;
  font-size: 12px;
  letter-spacing: 5px;
  color: var(--muted);
}

/* SECTION LABEL */
.section-label {
  font-family: 'Bebas Neue', cursive;
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--ink);
  text-align: center;
  margin: 28px 0 16px;
  position: relative;
}
.section-label::before,
.section-label::after {
  content: '';
  display: inline-block;
  width: 40px;
  height: 2px;
  background: var(--gold);
  vertical-align: middle;
  margin: 0 10px;
}

/* CREW GRID */
.crew-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.crew-card {
  cursor: pointer;
  border-radius: 4px;
  overflow: hidden;
  border: 3px solid transparent;
  transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  background: var(--ink);
  position: relative;
}

.crew-card:hover {
  transform: scale(1.03);
  box-shadow: 0 6px 20px rgba(139,0,0,0.3);
}

.crew-card.selected {
  border-color: var(--crimson3);
  box-shadow: 0 0 0 3px var(--crimson3), 0 0 20px rgba(220,20,60,0.5);
  animation: pulse-border 1.5s infinite;
}

@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 0 3px var(--crimson3), 0 0 20px rgba(220,20,60,0.5); }
  50% { box-shadow: 0 0 0 4px var(--crimson3), 0 0 35px rgba(220,20,60,0.7); }
}

.crew-photo {
  width: 100%;
  padding-bottom: 100%;
  background-size: cover;
  background-position: center top;
  position: relative;
}

.crew-photo::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to top, rgba(44,16,16,0.85), transparent);
}

.crew-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--cream);
  text-align: center;
  padding: 8px 4px;
  background: var(--ink);
  border-top: 2px solid var(--crimson);
}

/* PHOTO BACKGROUNDS */
.photo-1 { background-image: var(--img1); }
.photo-2 { background-image: var(--img2); }
.photo-3 { background-image: var(--img3); }
.photo-4 { background-image: var(--img4); }
.photo-5 { background-image: var(--img5); }
.photo-6 { background-image: var(--img6); }
.photo-7 { background-image: var(--img7); }

/* ANALYZE BUTTON */
.analyze-btn {
  width: 100%;
  padding: 18px;
  font-family: 'Bebas Neue', cursive;
  font-size: 20px;
  letter-spacing: 3px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-bottom: 24px;
  text-transform: uppercase;
}

.analyze-btn.disabled {
  background: #C5B0B0;
  color: #8A6A6A;
  cursor: not-allowed;
}

.analyze-btn.active {
  background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson3) 50%, var(--crimson2) 100%);
  color: var(--cream);
  box-shadow: 0 4px 15px rgba(139,0,0,0.4);
}

.analyze-btn.active:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(139,0,0,0.5);
}

.analyze-btn.spinning {
  background: #C5B0B0;
  color: #8A6A6A;
  cursor: not-allowed;
}

/* SPIN BOX */
.spin-box {
  display: none;
  background: var(--ink);
  border: 3px solid var(--gold);
  border-radius: 6px;
  padding: 20px;
  text-align: center;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.spin-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--crimson), var(--gold), var(--crimson));
}

.spin-label {
  font-family: 'Bebas Neue', cursive;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
  margin-bottom: 10px;
}

.spin-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px;
  color: var(--cream);
  letter-spacing: 2px;
  animation: shake 0.15s infinite;
}

.spin-emoji {
  font-size: 32px;
  display: block;
  margin-bottom: 8px;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

/* RESULT CARD */
.result-card {
  display: none;
  background: white;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(44,16,16,0.15);
  animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes pop-in {
  0% { opacity: 0; transform: scale(0.85) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.result-top-stripe {
  height: 5px;
  background: linear-gradient(90deg, var(--crimson), var(--gold), var(--crimson3));
}

.result-body {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border-bottom: 1px solid rgba(139,0,0,0.1);
}

.result-crew-photo {
  width: 80px;
  height: 80px;
  border-radius: 4px;
  background-size: cover;
  background-position: center top;
  border: 3px solid var(--crimson);
  flex-shrink: 0;
}

.result-arrow {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px;
  color: var(--gold);
  flex-shrink: 0;
}

.result-figure-box {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.result-figure-emoji {
  font-size: 40px;
  width: 64px;
  height: 64px;
  background: var(--ink);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.result-figure-info {
  flex: 1;
}

.result-figure-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 24px;
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: 1px;
}

.result-category-badge {
  display: inline-block;
  font-family: 'Bebas Neue', cursive;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 3px 10px;
  border-radius: 2px;
  margin-top: 4px;
}

.badge-historical { background: var(--gold); color: white; }
.badge-athlete { background: var(--crimson); color: white; }
.badge-celebrity { background: var(--crimson2); color: white; }

/* AI STORY */
.story-section {
  padding: 16px 20px 20px;
}

.story-label {
  font-family: 'Bebas Neue', cursive;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
  margin-bottom: 10px;
}

.story-text {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink);
  opacity: 0;
  transition: opacity 0.6s;
}

.story-text.visible { opacity: 1; }

.dot-pulse {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 8px 0;
}

.dot-pulse span {
  width: 8px; height: 8px;
  background: var(--crimson);
  border-radius: 50%;
  animation: dot-bounce 1.2s infinite;
}
.dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
.dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
  40% { transform: scale(1.1); opacity: 1; }
}

/* CASE FILES */
.case-files-section {
  margin-top: 32px;
}

.case-files-toggle {
  width: 100%;
  background: var(--ink);
  color: var(--cream);
  border: none;
  padding: 14px 20px;
  font-family: 'Bebas Neue', cursive;
  font-size: 16px;
  letter-spacing: 3px;
  cursor: pointer;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 4px;
}

.case-files-toggle:hover { background: #3D1A1A; }

.case-files-arrow { font-size: 14px; transition: transform 0.2s; }
.case-files-arrow.open { transform: rotate(180deg); }

.case-files-list {
  display: none;
  background: white;
  border: 1px solid rgba(139,0,0,0.15);
  border-top: none;
  border-radius: 0 0 4px 4px;
}

.case-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(139,0,0,0.08);
}

.case-row:last-child { border-bottom: none; }

.case-thumb {
  width: 44px;
  height: 44px;
  border-radius: 3px;
  background-size: cover;
  background-position: center top;
  border: 2px solid var(--crimson);
  flex-shrink: 0;
}

.case-arrow-small {
  font-family: 'Bebas Neue', cursive;
  font-size: 18px;
  color: var(--gold);
}

.case-figure-emoji-sm {
  font-size: 22px;
}

.case-info {
  flex: 1;
  min-width: 0;
}

.case-names {
  font-family: 'Bebas Neue', cursive;
  font-size: 14px;
  letter-spacing: 1px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.case-time {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
}

.empty-files {
  padding: 20px;
  text-align: center;
  font-style: italic;
  color: var(--muted);
  font-size: 14px;
}
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="eyebrow">&#128274; CLASSIFIED INTEL &#128274;</div>
  <h1 class="main-title">HOOSIER DYS</h1>

        <div id="resultFigureEmoji" class="result-figure-emoji"></div>

  <!-- CASE FILES -->
  <div class="case-files-section">

      <span>&#128193; CASE FILES</span>

    <div class="case-files-list" id="caseFilesList">
      <div class="empty-files" id="emptyFiles">No cases opened yet. Start investigating.</div>
    </div>

</div>

<script>
var selectedCrew = -1;
var isSpinning = false;
var caseHistory = [];

var crewNames = [
  "Homie 1", "Homie 2", "Homie 3", "Homie 4",
  "Homie 5", "Homie 6", "Homie 7"
];

var photoClasses = [
  "photo-1", "photo-2", "photo-3", "photo-4",
  "photo-5", "photo-6", "photo-7"
];

var figures = [
  { name: "Abraham Lincoln", cat: "Historical", emoji: "&#127963;" },
  { name: "Cleopatra", cat: "Historical", emoji: "&#128081;" },
  { name: "Napoleon Bonaparte", cat: "Historical", emoji: "&#9876;" },
  { name: "Harriet Tubman", cat: "Historical", emoji: "&#11088;" },
  { name: "Julius Caesar", cat: "Historical", emoji: "&#129412;" },
  { name: "Marie Curie", cat: "Historical", emoji: "&#9878;" },
  { name: "Genghis Khan", cat: "Historical", emoji: "&#129354;" },
  { name: "Rosa Parks", cat: "Historical", emoji: "&#9992;" },
  { name: "Frederick Douglass", cat: "Historical", emoji: "&#128214;" },
  { name: "Joan of Arc", cat: "Historical", emoji: "&#9876;" },
  { name: "Marcus Aurelius", cat: "Historical", emoji: "&#128081;" },
  { name: "Nikola Tesla", cat: "Historical", emoji: "&#9889;" },
  { name: "Sojourner Truth", cat: "Historical", emoji: "&#9997;" },
  { name: "Sun Tzu", cat: "Historical", emoji: "&#128214;" },
  { name: "LeBron James", cat: "Athlete", emoji: "&#127944;" },
  { name: "Serena Williams", cat: "Athlete", emoji: "&#127934;" },
  { name: "Michael Jordan", cat: "Athlete", emoji: "&#127944;" },
  { name: "Muhammad Ali", cat: "Athlete", emoji: "&#129354;" },
  { name: "Simone Biles", cat: "Athlete", emoji: "&#129351;" },
  { name: "Shaquille ONeal", cat: "Athlete", emoji: "&#127944;" },
  { name: "Kobe Bryant", cat: "Athlete", emoji: "&#128081;" },
  { name: "Usain Bolt", cat: "Athlete", emoji: "&#9889;" },
  { name: "Mike Tyson", cat: "Athlete", emoji: "&#129354;" },
  { name: "Deion Sanders", cat: "Athlete", emoji: "&#127944;" },
  { name: "Bo Jackson", cat: "Athlete", emoji: "&#127944;" },
  { name: "Magic Johnson", cat: "Athlete", emoji: "&#127944;" },
  { name: "Jackie Robinson", cat: "Athlete", emoji: "&#9918;" },
  { name: "Wilt Chamberlain", cat: "Athlete", emoji: "&#127944;" },
  { name: "Beyonce", cat: "Celebrity", emoji: "&#127775;" },
  { name: "Kevin Hart", cat: "Celebrity", emoji: "&#127918;" },
  { name: "Jay-Z", cat: "Celebrity", emoji: "&#127925;" },
  { name: "Oprah Winfrey", cat: "Celebrity", emoji: "&#127897;" },
  { name: "Tyler Perry", cat: "Celebrity", emoji: "&#127916;" },
  { name: "Eddie Murphy", cat: "Celebrity", emoji: "&#127918;" },
  { name: "Cardi B", cat: "Celebrity", emoji: "&#128138;" },
  { name: "Dave Chappelle", cat: "Celebrity", emoji: "&#127918;" },
  { name: "Denzel Washington", cat: "Celebrity", emoji: "&#127941;" },
  { name: "Will Smith", cat: "Celebrity", emoji: "&#128142;" },
  { name: "Kanye West", cat: "Celebrity", emoji: "&#127911;" },
  { name: "Nicki Minaj", cat: "Celebrity", emoji: "&#127775;" },
  { name: "50 Cent", cat: "Celebrity", emoji: "&#127925;" },
  { name: "Steve Harvey", cat: "Celebrity", emoji: "&#127918;" },
  { name: "Bernie Mac", cat: "Celebrity", emoji: "&#127918;" },
  { name: "Snoop Dogg", cat: "Celebrity", emoji: "&#127915;" }
];

function selectCrew(idx) {
  if (isSpinning) return;
  selectedCrew = idx;
  var cards = document.getElementById("crewGrid").querySelectorAll(".crew-card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove("selected");
  }
  cards[idx].classList.add("selected");
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn active";
  btn.textContent = "Analyze " + crewNames[idx] + "s WDYS Data Points";
  document.getElementById("spinBox").style.display = "none";
  document.getElementById("resultCard").style.display = "none";
}

function startSpin() {
  if (isSpinning || selectedCrew === -1) return;
  isSpinning = true;
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn spinning";
  btn.textContent = "Analyzing Data Points...";
  document.getElementById("resultCard").style.display = "none";
  var spinBox = document.getElementById("spinBox");
  spinBox.style.display = "block";
  var delays = [60, 60, 80, 80, 100, 120, 150, 180, 220, 280, 350, 430, 520, 620, 720];
  var count = 0;
  var nameEl = document.getElementById("spinName");
  var emojiEl = document.getElementById("spinEmoji");
  function tick() {
    if (count < delays.length) {
      var r = Math.floor(Math.random() * figures.length);
      nameEl.textContent = figures[r].name;
      emojiEl.innerHTML = figures[r].emoji;
      count++;
      setTimeout(tick, delays[count - 1]);
    } else {
      var finalIdx = Math.floor(Math.random() * figures.length);
      var fig = figures[finalIdx];
      nameEl.textContent = fig.name;
      emojiEl.innerHTML = fig.emoji;
      nameEl.style.animation = "none";
      setTimeout(function() { showResult(fig); }, 500);
    }
  }
  tick();
}

function showResult(fig) {
  var spinBox = document.getElementById("spinBox");
  spinBox.style.display = "none";
  var card = document.getElementById("resultCard");
  card.style.display = "block";
  var photoEl = document.getElementById("resultCrewPhoto");
  photoEl.className = "result-crew-photo " + photoClasses[selectedCrew];
  document.getElementById("resultFigureEmoji").innerHTML = fig.emoji;
  document.getElementById("resultFigureName").textContent = fig.name;
  var badge = document.getElementById("resultBadge");
  badge.textContent = fig.cat;
  badge.className = "result-category-badge badge-" + fig.cat.toLowerCase();
  var storyContainer = document.getElementById("storyContainer");
  storyContainer.innerHTML = "<div class=\"dot-pulse\"><span></span><span></span><span></span></div>";
  generateStory(crewNames[selectedCrew], fig);
  addToCaseFiles(selectedCrew, fig);
  isSpinning = false;
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn active";
  btn.textContent = "Analyze " + crewNames[selectedCrew] + "s WDYS Data Points";
}

function generateStory(crewName, fig) {
  var prompt = "Write a 3-4 sentence funny roast-style story about how " + crewName + " got romantically or hilariously linked to " + fig.name + ". Reference " + fig.name + "s most famous traits or historical facts. Make it specific, absurd, and funny. End with the sentence: And now we finally know. Keep it under 100 words.";
  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var text = "";
    if (data.content && data.content[0] && data.content[0].text) {
      text = data.content[0].text;
    } else {
      text = "Sources deep in the group chat confirm this connection has been verified. The intelligence is undeniable. And now we finally know.";
    }
    var storyContainer = document.getElementById("storyContainer");
    storyContainer.innerHTML = "<p class=\"story-text\" id=\"storyText\">" + text + "</p>";
    setTimeout(function() {
      var st = document.getElementById("storyText");
      if (st) st.classList.add("visible");
    }, 50);
  })
  .catch(function() {
    var storyContainer = document.getElementById("storyContainer");
    storyContainer.innerHTML = "<p class=\"story-text visible\" id=\"storyText\">The Bureau could not retrieve the full intelligence report at this time. But the connection has been documented. And now we finally know.</p>";
  });
}

function addToCaseFiles(crewIdx, fig) {
  var now = new Date();
  var timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  caseHistory.unshift({ crewIdx: crewIdx, fig: fig, time: timeStr });
  renderCaseFiles();
}

function renderCaseFiles() {
  var list = document.getElementById("caseFilesList");
  var empty = document.getElementById("emptyFiles");
  if (caseHistory.length === 0) {
    if (empty) empty.style.display = "block";
    return;
  }
  list.innerHTML = "";
  for (var i = 0; i < caseHistory.length; i++) {
    var c = caseHistory[i];
    var row = document.createElement("div");
    row.className = "case-row";
    var thumb = document.createElement("div");
    thumb.className = "case-thumb " + photoClasses[c.crewIdx];
    var arrow = document.createElement("div");
    arrow.className = "case-arrow-small";
    arrow.textContent = ">";
    var emojiEl = document.createElement("div");
    emojiEl.className = "case-figure-emoji-sm";
    emojiEl.innerHTML = c.fig.emoji;
    var info = document.createElement("div");
    info.className = "case-info";
    var names = document.createElement("div");
    names.className = "case-names";
    names.textContent = crewNames[c.crewIdx] + " x " + c.fig.name;
    var timeEl = document.createElement("div");
    timeEl.className = "case-time";
    timeEl.textContent = c.time;
    info.appendChild(names);
    info.appendChild(timeEl);
    row.appendChild(thumb);
    row.appendChild(arrow);
    row.appendChild(emojiEl);
    row.appendChild(info);
    list.appendChild(row);
  }
}

function toggleCaseFiles() {
  var list = document.getElementById("caseFilesList");
  var arrow = document.getElementById("caseArrow");
  if (list.style.display === "block") {
    list.style.display = "none";
    arrow.classList.remove("open");
  } else {
    list.style.display = "block";
    arrow.classList.add("open");
  }
}
</script>
