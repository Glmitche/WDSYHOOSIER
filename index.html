  --cream: #FDF6EC;
  --crimson: #8B0000;
  --crimson2: #B22222;
  --crimson3: #DC143C;
  --gold: #B8860B;
  --ink: #2C1010;
  --muted: #7A5C5C;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--cream);
  background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(139,0,0,0.04) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(139,0,0,0.04) 40px);
  font-family: 'Lora', serif;
  color: var(--ink);
  min-height: 100vh;
}
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
.eyebrow { font-family: 'Bebas Neue', cursive; font-size: 13px; letter-spacing: 6px; color: var(--gold); text-align: center; margin-bottom: 4px; }
.main-title { font-family: 'Bebas Neue', cursive; font-size: clamp(72px, 20vw, 120px); color: var(--crimson); text-align: center; line-height: 0.9; text-shadow: 3px 3px 0 var(--cream), 4px 4px 0 rgba(139,0,0,0.3); letter-spacing: 4px; }
.subtitle-bar { border-top: 2px solid var(--crimson); margin: 10px 0 6px; padding-top: 8px; text-align: center; }
.subtitle { font-family: 'Bebas Neue', cursive; font-size: 12px; letter-spacing: 5px; color: var(--muted); }
.section-label { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 4px; color: var(--ink); text-align: center; margin: 28px 0 16px; position: relative; }
.section-label::before,.section-label::after { content: ''; display: inline-block; width: 40px; height: 2px; background: var(--gold); vertical-align: middle; margin: 0 10px; }

function selectCrew(idx) {
  if (isSpinning) return;
  selectedCrew = idx;
  var cards = document.getElementById("crewGrid").querySelectorAll(".crew-card");
  for (var i = 0; i < cards.length; i++) { cards[i].classList.remove("selected"); }
  cards[idx].classList.add("selected");
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn active";
  btn.textContent = "Analyze " + crewNames[idx] + "s WDYS Data Points";
  document.getElementById("spinBox").style.display = "none";
  document.getElementById("resultCard").style.display = "none";
}

function startSpin() {
  if (isSpinning || selectedCrew === -1) return;
  isSpinning = true;
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn spinning";
  btn.textContent = "Analyzing Data Points...";
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("shareBtn").style.display = "none";
  var spinBox = document.getElementById("spinBox");
  spinBox.style.display = "block";
  var delays = [60,60,80,80,100,120,150,180,220,280,350,430,520,620,720];
  var count = 0;
  var nameEl = document.getElementById("spinName");
  var emojiEl = document.getElementById("spinEmoji");
  function tick() {
    if (count < delays.length) {
      var r = Math.floor(Math.random() * figures.length);
      nameEl.textContent = figures[r].name;
      emojiEl.innerHTML = figures[r].emoji;
      count++;
      setTimeout(tick, delays[count - 1]);
    } else {
      var finalIdx = Math.floor(Math.random() * figures.length);
      currentFig = figures[finalIdx];
      nameEl.textContent = currentFig.name;
      emojiEl.innerHTML = currentFig.emoji;
      nameEl.style.animation = "none";
      setTimeout(function() { showResult(currentFig); }, 500);
    }
  }
  tick();
}

function showResult(fig) {
  document.getElementById("spinBox").style.display = "none";
  var card = document.getElementById("resultCard");
  card.style.display = "block";
  var photoEl = document.getElementById("resultCrewPhoto");
  photoEl.className = "result-crew-photo " + photoClasses[selectedCrew];
  document.getElementById("resultFigureEmoji").innerHTML = fig.emoji;
  document.getElementById("resultFigureName").textContent = fig.name;
  var badge = document.getElementById("resultBadge");
  badge.textContent = fig.cat;
  badge.className = "result-category-badge badge-" + fig.cat.toLowerCase();
  var storyContainer = document.getElementById("storyContainer");
  storyContainer.innerHTML = "<p class=\"story-text\">" + fig.story + "</p>";
  document.getElementById("shareBtn").style.display = "flex";
  currentCrewName = crewNames[selectedCrew];
  saveToSharedDB(selectedCrew, fig);
  isSpinning = false;
  var btn = document.getElementById("analyzeBtn");
  btn.className = "analyze-btn active";
  btn.textContent = "Analyze " + crewNames[selectedCrew] + "s WDYS Data Points";
}

function shareStory() {
  if (!currentFig) return;
  var msg = "WDYS? INTELLIGENCE REPORT\n\n" + currentCrewName + " x " + currentFig.name + "\n\n" + currentFig.story + "\n\nPlay at: " + window.location.href;
  if (navigator.share) {
    navigator.share({ title: "WDYS? Report", text: msg }).catch(function() { fallbackShare(msg); });
  } else {
    fallbackShare(msg);
  }
}

function fallbackShare(msg) {
  var encoded = encodeURIComponent(msg);
  var smsUrl = "sms:?body=" + encoded;
  window.open(smsUrl, "_blank");
}

function saveToSharedDB(crewIdx, fig) {
  var now = new Date();
  var entry = {
    crewName: crewNames[crewIdx],
    crewIdx: crewIdx,
    figName: fig.name,
    figEmoji: fig.emoji,
    figCat: fig.cat,
    time: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
    date: now.toLocaleDateString()
  };
  var key = "case_" + now.getTime();
  try {
    window.storage.set(key, JSON.stringify(entry), true).then(function() {
      loadSharedCaseFiles();
    }).catch(function() {
      saveLocalFallback(entry);
    });
  } catch(e) {
    saveLocalFallback(entry);
  }
}

var localHistory = [];
function saveLocalFallback(entry) {
  localHistory.unshift(entry);
  renderLocalCaseFiles();
}

function renderLocalCaseFiles() {
  var list = document.getElementById("caseFilesList");
  if (localHistory.length === 0) {
    list.innerHTML = "<div class='empty-files'>No cases yet. Start investigating.</div>";
    return;
  }
  renderRows(list, localHistory);
}

function loadSharedCaseFiles() {
  var list = document.getElementById("caseFilesList");
  try {
    window.storage.list("case_", true).then(function(result) {
      if (!result || !result.keys || result.keys.length === 0) {
        list.innerHTML = "<div class='empty-files'>No shared cases yet.</div>";
        return;
      }
      var keys = result.keys.slice().sort().reverse();
      var promises = keys.map(function(k) { return window.storage.get(k, true); });
      Promise.all(promises).then(function(results) {
        var entries = [];
        for (var i = 0; i < results.length; i++) {
          if (results[i] && results[i].value) {
            try { entries.push(JSON.parse(results[i].value)); } catch(e) {}
          }
        }
        if (entries.length === 0) {
          list.innerHTML = "<div class='empty-files'>No shared cases yet.</div>";
        } else {
          renderRows(list, entries);
        }
        list.innerHTML += "<div class='db-status'>&#127760; SHARED ACROSS THE CREW</div>";
      }).catch(function() { renderLocalCaseFiles(); });
    }).catch(function() { renderLocalCaseFiles(); });
  } catch(e) {
    renderLocalCaseFiles();
  }
}

function renderRows(list, entries) {
  list.innerHTML = "";
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    var photoClass = photoClasses[e.crewIdx] || "photo-1";
    if (e.crewName) {
      var nameIdx = crewNames.indexOf(e.crewName);
      if (nameIdx >= 0) photoClass = photoClasses[nameIdx];
    }
    var row = document.createElement("div");
    row.className = "case-row";
    var thumb = document.createElement("div");
    thumb.className = "case-thumb " + photoClass;
    var arrow = document.createElement("div");
    arrow.className = "case-arrow-small";
    arrow.textContent = ">";
    var emojiEl = document.createElement("div");
    emojiEl.className = "case-figure-emoji-sm";
    emojiEl.innerHTML = e.figEmoji || "";
    var info = document.createElement("div");
    info.className = "case-info";
    var names = document.createElement("div");
    names.className = "case-names";
    names.textContent = (e.crewName || "?") + " x " + (e.figName || "?");
    var timeEl = document.createElement("div");
    timeEl.className = "case-time";
    timeEl.textContent = (e.date || "") + " " + (e.time || "");
    info.appendChild(names);
    info.appendChild(timeEl);
    row.appendChild(thumb);
    row.appendChild(arrow);
    row.appendChild(emojiEl);
    row.appendChild(info);
    list.appendChild(row);
  }
}

function toggleCaseFiles() {
  var list = document.getElementById("caseFilesList");
  var arrow = document.getElementById("caseArrow");
  if (list.style.display === "block") {
    list.style.display = "none";
    arrow.classList.remove("open");
  } else {
    list.style.display = "block";
    arrow.classList.add("open");
    loadSharedCaseFiles();
  }
}

loadSharedCaseFiles();
</script>
